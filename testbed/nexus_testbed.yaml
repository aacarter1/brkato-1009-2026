# Example testbed for NX-OS BGP health checks.
# Set credentials via environment variables or a secrets file; do not commit real passwords.
testbed:
  name: nexus_bgp_lab

devices:
  nxos-spine-1:
    os: nxos
    type: switch
    platform: n9k
    credentials:
      default:
        username: "%ENV{PYATS_USERNAME}%"
        password: "%ENV{PYATS_PASSWORD}%"
    connections:
      cli:
        protocol: ssh
        ip: 198.18.134.101
        port: 22
        arguments:
          connection_timeout: 360

